   <text style="fill: #582c83; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="47.52" y="31.752" transform="rotate(-0 47.52 31.752)">SUPREME  /  PUBLISHED RESULTS</text>
  </g>
  <g id="text_28">
   <text style="fill: #201c2c; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="47.52" y="68.04" transform="rotate(-0 47.52 68.04)">Published variation across ten seeds</text>
  </g>
  <g id="text_29">
   <text style="fill: #625d70; font: 12px 'DejaVu Sans'; text-anchor: start" x="47.52" y="95.256" transform="rotate(-0 47.52 95.256)">Pins Face Recognition · random-sample unlearning · forget 0.1%</text>
  </g>
  <g id="text_30">
   <text style="fill: #201c2c; font: 11px 'DejaVu Sans'; text-anchor: start" x="47.52" y="387.828" transform="rotate(-0 47.52 387.828)">Dots: mean. Whiskers: one standard deviation across seeds (not confidence intervals).</text>
  </g>
  <g id="text_31">
   <text style="fill: #625d70; font: 10px 'DejaVu Sans'; text-anchor: start" x="47.52" y="407.3328" transform="rotate(-0 47.52 407.3328)">Difference = unlearned minus retrained. Zero indicates agreement on this metric.</text>
