<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" role="img" aria-labelledby="title description">
  <title id="title">SUPREME: reproducible evaluation for image unlearning</title>
  <desc id="description">Training, unlearning and evaluation, with independent seed control across every stage.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171727"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a6adbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="384" rx="20" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="104" fill="#ffd700" font-size="90" font-weight="800" letter-spacing="1">SUPREME</text>
    <text x="600" y="168" fill="#f0f3f8" font-size="40">Reproducible evaluation for image unlearning</text>

    <rect x="105" y="214" width="300" height="68" rx="14" fill="#14271e" stroke="#66d982" stroke-width="2"/>
    <text x="255" y="260" fill="#8feaab" font-size="38" font-weight="600">Training</text>

    <path d="M 416 248 H 439" fill="none" stroke="#a6adbb" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="450" y="214" width="300" height="68" rx="14" fill="#102930" stroke="#4dd0e1" stroke-width="2"/>
    <text x="600" y="260" fill="#80e2ee" font-size="38" font-weight="600">Unlearning</text>

    <path d="M 761 248 H 784" fill="none" stroke="#a6adbb" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="795" y="214" width="300" height="68" rx="14" fill="#272039" stroke="#b19cd9" stroke-width="2"/>
    <text x="945" y="260" fill="#d2bcff" font-size="38" font-weight="600">Evaluation</text>

    <text x="600" y="343" fill="#d4dae4" font-size="36">Independent seed control across every stage</text>
  </g>
</svg>
